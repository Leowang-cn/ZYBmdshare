<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MDShare · 笔记</title><link rel="stylesheet" href="/app.css"></head>
<body>
<section id="pin-login" hidden><form id="pin-form"><div class="brand">MDShare</div><h1>查看分享</h1><label for="reader-pin">访问 PIN</label><input id="reader-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><button type="submit" class="primary">打开笔记</button><p id="pin-error" role="alert"></p></form></section>
<section id="login" hidden><form id="login-form"><div class="brand">MD<span>Share</span></div><h1>你的笔记空间</h1><label for="token">访问令牌</label><input id="token" type="password" autocomplete="current-password" required><button type="submit">登录</button><p id="login-error" role="alert"></p></form></section>
<div id="workspace" hidden>
<aside><header><a class="brand" href="/">MD<span>Share</span></a><button id="new-root" title="新建笔记" aria-label="新建笔记"><i data-lucide="plus"></i></button></header><input id="search" type="search" placeholder="搜索笔记" aria-label="搜索笔记"><nav id="tree" aria-label="笔记目录"></nav><footer><span id="count"></span><button id="backup" title="导出备份" aria-label="导出备份"><i data-lucide="download"></i></button><button id="logout" title="退出" aria-label="退出"><i data-lucide="log-out"></i></button></footer></aside>
<main><header class="toolbar"><button id="toggle-sidebar" title="切换目录" aria-label="切换目录" aria-expanded="true"><i data-lucide="panel-left"></i></button><span id="breadcrumb">笔记</span><div class="actions"><button id="share" title="分享" aria-label="分享"><i data-lucide="share-2"></i></button><button id="save" title="保存" aria-label="保存"><i data-lucide="save"></i></button><details id="more"><summary title="更多操作" aria-label="更多操作"><i data-lucide="ellipsis"></i></summary><div class="more-menu"><button id="new-child"><i data-lucide="file-plus"></i>新建子笔记</button><button id="upload"><i data-lucide="paperclip"></i>上传附件</button><label id="parent-label">所属目录<select id="parent" aria-label="所属目录"></select></label><button id="remove"><i data-lucide="trash-2"></i>删除笔记及子笔记</button></div></details></div></header>
<div id="empty"><i data-lucide="notebook-pen"></i><h1>暂无笔记</h1><button id="empty-create" class="primary">新建笔记</button></div>
<section id="document" hidden><div class="document-heading"><textarea id="title" aria-label="笔记标题" maxlength="200" rows="1"></textarea><div class="metadata"><span id="updated"></span></div></div><div class="viewbar"><div class="tabs"><button id="edit-tab" aria-pressed="true">编辑</button><button id="preview-tab" aria-pressed="false">阅读</button><button id="split-tab" aria-pressed="false">分屏</button></div><span id="status" role="status"></span></div><div id="panes"><textarea id="editor" aria-label="Markdown 正文" spellcheck="false"></textarea><article id="preview" class="markdown"></article></div></section></main>
</div>
<dialog id="share-dialog"><form method="dialog"><header><h2>分享此笔记及子笔记</h2><button title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></header></form><label for="share-pin">4 位 PIN（留空自动生成）</label><input id="share-pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="自动生成"><button id="create-share" class="primary">创建只读链接</button><div id="new-link" hidden><input id="share-url" readonly aria-label="分享链接"><p>PIN：<strong id="created-pin"></strong></p><button id="copy-link" title="复制链接" aria-label="复制链接"><i data-lucide="copy"></i></button></div><div id="share-list"></div></dialog>
<input id="file" type="file" hidden accept="image/png,image/jpeg,image/webp,image/gif,audio/mpeg,audio/ogg,audio/wav,audio/mp4,video/mp4,video/webm,application/pdf"><div id="toast" role="alert" hidden></div><script type="module" src="/app.js"></script>
</body></html>
